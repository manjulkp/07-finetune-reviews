[project]
name = "finetune-reviews"
version = "0.1.0"
description = "Fine-tune DistilBERT on Yelp reviews and test it on Amazon reviews"
requires-python = ">=3.12"
dependencies = ["datasets>=3.0", "matplotlib>=3.10", "torch>=2.9", "transformers>=4.50"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
